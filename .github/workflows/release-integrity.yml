# YORU_PRIORITY2_RELEASE_TRUTH_V1
name: Release integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate release versions and Alembic head
        run: python scripts/check-release-consistency.py
      - name: Validate Docker Compose model
        run: docker compose config --quiet

  runtime-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: yoru_test
          POSTGRES_USER: yoru
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yoru -d yoru_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://yoru:test_password@localhost:5432/yoru_test
      TEST_DATABASE_URL: postgresql+asyncpg://yoru:test_password@localhost:5432/yoru_test
      REDIS_URL: redis://localhost:6379/0
      TEST_REDIS_URL: redis://localhost:6379/1
      QDRANT_URL: http://localhost:6333
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001
      TRUSTED_HOSTS: testserver,localhost
      SESSION_SIGNING_KEY: ci-session-key-not-for-production
      REFRESH_TOKEN_PEPPER: ci-refresh-pepper-not-for-production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install API test dependencies
        run: python -m pip install -e "services/api[dev]"
      - name: Apply migrations
        run: alembic -c services/api/alembic.ini upgrade head
      - name: Validate assembled runtime contract
        run: python scripts/check-runtime-contract.py
      - name: Run runtime composition tests
        run: >-
          pytest
          services/api/tests/test_app_composition.py
          services/api/tests/test_runtime_truth.py
          services/api/tests/test_meta.py
          -q

  compose-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build deployable service images
        run: docker compose build api migrate worker storefront console
