name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v5
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: yoru_test
          POSTGRES_USER: yoru
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yoru -d yoru_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://yoru:test_password@localhost:5432/yoru_test
      TEST_DATABASE_URL: postgresql+asyncpg://yoru:test_password@localhost:5432/yoru_test
      REDIS_URL: redis://localhost:6379/0
      TEST_REDIS_URL: redis://localhost:6379/1
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001
      TRUSTED_HOSTS: testserver,localhost
      SESSION_SIGNING_KEY: ci-session-key-not-for-production
      REFRESH_TOKEN_PEPPER: ci-refresh-pepper-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e "services/api[dev]" -e "services/worker[dev]"
      - run: ruff check services
      - run: mypy services/api/src services/worker/src
      - run: python scripts/check-runtime-contract.py
      - run: alembic -c services/api/alembic.ini upgrade head
      - run: pytest services/api/tests services/worker/tests
      - name: Validate offline migration SQL
        run: alembic -c services/api/alembic.ini upgrade head --sql >/tmp/migration.sql

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
