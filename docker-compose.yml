name: yoru-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yoru}
      POSTGRES_USER: ${POSTGRES_USER:-yoru}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yoru_local_only}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [yoru]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [yoru]

  qdrant:
    image: qdrant/qdrant:v1.16.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks: [yoru]

  migrate:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    environment: &api_environment
      APP_ENV: ${APP_ENV:-local}
      APP_NAME: ${APP_NAME:-Yoru}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-yoru}:${POSTGRES_PASSWORD:-yoru_local_only}@postgres:5432/${POSTGRES_DB:-yoru}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-localhost,127.0.0.1,api}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-2592000}
      AUTH_RATE_LIMIT_ATTEMPTS: ${AUTH_RATE_LIMIT_ATTEMPTS:-5}
      AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-300}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      SESSION_SIGNING_KEY: ${SESSION_SIGNING_KEY:-local-development-key-change-before-production}
      REFRESH_TOKEN_PEPPER: ${REFRESH_TOKEN_PEPPER:-local-development-pepper-change-before-production}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [yoru]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment: *api_environment
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [yoru]

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
      target: runtime
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-yoru}:${POSTGRES_PASSWORD:-yoru_local_only}@postgres:5432/${POSTGRES_DB:-yoru}
      REDIS_URL: redis://redis:6379/0
      BOOKING_MAINTENANCE_ENABLED: ${BOOKING_MAINTENANCE_ENABLED:-true}
      BOOKING_MAINTENANCE_BATCH_SIZE: ${BOOKING_MAINTENANCE_BATCH_SIZE:-100}
      BOOKING_AUTO_NO_SHOW_ENABLED: ${BOOKING_AUTO_NO_SHOW_ENABLED:-false}
      BOOKING_AUTO_NO_SHOW_GRACE_MINUTES: ${BOOKING_AUTO_NO_SHOW_GRACE_MINUTES:-120}
      BOOKING_TRACKING_PING_RETENTION_DAYS: ${BOOKING_TRACKING_PING_RETENTION_DAYS:-30}
      WORKER_JOB_MAX_ATTEMPTS: ${WORKER_JOB_MAX_ATTEMPTS:-3}
      WORKER_JOB_RETRY_BASE_SECONDS: ${WORKER_JOB_RETRY_BASE_SECONDS:-0.5}
      WORKER_DEAD_LETTER_KEY: ${WORKER_DEAD_LETTER_KEY:-yoru:worker:dead-letter}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [yoru]


  worker-test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: services/worker/Dockerfile
      target: test
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-yoru}:${POSTGRES_PASSWORD:-yoru_local_only}@postgres:5432/${POSTGRES_DB:-yoru}
      REDIS_URL: redis://redis:6379/0
      BOOKING_MAINTENANCE_ENABLED: ${BOOKING_MAINTENANCE_ENABLED:-true}
      BOOKING_MAINTENANCE_BATCH_SIZE: ${BOOKING_MAINTENANCE_BATCH_SIZE:-100}
      BOOKING_AUTO_NO_SHOW_ENABLED: ${BOOKING_AUTO_NO_SHOW_ENABLED:-false}
      BOOKING_AUTO_NO_SHOW_GRACE_MINUTES: ${BOOKING_AUTO_NO_SHOW_GRACE_MINUTES:-120}
      BOOKING_TRACKING_PING_RETENTION_DAYS: ${BOOKING_TRACKING_PING_RETENTION_DAYS:-30}
      WORKER_JOB_MAX_ATTEMPTS: ${WORKER_JOB_MAX_ATTEMPTS:-3}
      WORKER_JOB_RETRY_BASE_SECONDS: ${WORKER_JOB_RETRY_BASE_SECONDS:-0.5}
      WORKER_DEAD_LETTER_KEY: ${WORKER_DEAD_LETTER_KEY:-yoru:worker:dead-letter}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [yoru]
  storefront:
    build:
      context: .
      dockerfile: apps/storefront/Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    networks: [yoru]

  console:
    build:
      context: .
      dockerfile: apps/console/Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "3001:3001"
    depends_on:
      api:
        condition: service_healthy
    networks: [yoru]

networks:
  yoru:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
